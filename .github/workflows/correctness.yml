name: Correctness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 bootstrap.py
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      - run: cmake --build build -j 4
      - run: ctest --test-dir build --output-on-failure
      - run: g++ -std=c++20 -fsanitize=address,undefined -fno-omit-frame-pointer -g src/bank_probe.cpp -o build/bank_probe_sanitized
      - run: python3 tests/bank_diff.py build/bank_probe_sanitized build/bank-sanitized-validation
      - run: g++ -std=c++20 -fsanitize=address,undefined -fno-omit-frame-pointer -g src/read_recovery_probe.cpp -o build/read_recovery_sanitized
      - run: python3 tests/read_recovery_contract.py build/read_recovery_sanitized
      - run: g++ -std=c++20 -fsanitize=address,undefined -fno-omit-frame-pointer -g -Ivendor/HBXim/src src/bank_adapter_contract.cpp -o build/bank_adapter_sanitized
      - run: build/bank_adapter_sanitized
      - run: g++ -std=c++20 -fsanitize=address,undefined -fno-omit-frame-pointer -g src/page_lifecycle_probe.cpp -o build/page_lifecycle_sanitized
      - run: python3 gpu/verify_lifecycle.py build/page_lifecycle_sanitized build/lifecycle-sanitized-validation CPU
      - run: g++ -std=c++20 -fsanitize=address,undefined -fno-omit-frame-pointer -g -Ibuild/eventlab-overlay/include src/page_wire_probe.cpp build/eventlab/libhbf_eventlab.a -o build/page_wire_sanitized
      - run: python3 tests/page_wire_diff.py build/page_wire_sanitized build/wire-sanitizer-validation
      - run: g++ -std=c++20 -fsanitize=address,undefined -fno-omit-frame-pointer -g -Ibuild/eventlab-overlay/include src/multichannel_race.cpp build/eventlab/libhbf_eventlab.a -o build/multichannel_sanitized
      - run: python3 tests/multichannel_diff.py build/multichannel_sanitized build/multichannel-sanitized CPU
      - run: g++ -std=c++20 -fsanitize=address,undefined -fno-omit-frame-pointer -g -Ibuild/eventlab-overlay/include src/page_group_contract.cpp build/eventlab/libhbf_eventlab.a -o build/page_group_sanitized
      - run: build/page_group_sanitized
      - run: g++ -std=c++20 -fsanitize=address,undefined -fno-omit-frame-pointer -g -Ibuild/eventlab-overlay/include src/reset_race.cpp build/eventlab/libhbf_eventlab.a -o build/reset_sanitized
      - run: python3 tests/reset_diff.py build/reset_sanitized build/reset-sanitized CPU
      - run: g++ -std=c++20 -fsanitize=address,undefined -fno-omit-frame-pointer -g -Ibuild/eventlab-overlay/include src/device_reset_probe.cpp build/eventlab/libhbf_eventlab.a -o build/device_reset_sanitized
      - run: python3 tests/device_reset_diff.py build/device_reset_sanitized build/device-reset-sanitized
      - run: cmake -S . -B build-driver-sanitized -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
      - run: cmake --build build-driver-sanitized --target driver_reset_probe external_reset_probe aou_probe ucie_probe ucie_trace -j 4
      - run: python3 tests/ucie_diff.py build-driver-sanitized/ucie_trace build-driver-sanitized/ucie_probe build/ucie-sanitized
      - run: python3 tests/aou_diff.py build-driver-sanitized/aou_probe build/aou-sanitized
      - run: python3 tests/external_reset_diff.py build-driver-sanitized/external_reset_probe build/external-reset-sanitized
      - run: python3 tests/driver_reset_diff.py build-driver-sanitized/driver_reset_probe build/driver-reset-sanitized
      - run: cmake -S build/eventlab-overlay -B build-upstream -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DHBF_EVENTLAB_EXPERIMENT_TESTS=OFF
      - run: cmake --build build-upstream -j 4
      - run: ctest --test-dir build-upstream --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correctness-evidence
          path: |
            build/Testing/Temporary/
            build-upstream/Testing/Temporary/
            build/validation/
            build/protocol-validation/
            build/concurrent-validation/
            build/recovery-validation/
            build/bank-validation/
            build/bank-sanitized-validation/
            build/bank-anns-validation/
            build/wire-sanitizer-validation/
            build/multichannel-sanitized/
            build/multichannel-mapping/
            build/multichannel-race/
            build/reset-validation/
            build/device-reset-validation/
            build/driver-reset-validation/
            build/external-reset-validation/
            build/aou-validation/
            build/aou-sanitized/
            build/external-reset-sanitized/
            build/driver-reset-sanitized/
            build/device-reset-sanitized/
            build/reset-sanitized/
            build/page-wire-validation/
            build/wire-anns-validation/
            build/lifecycle-validation/
            build/lifecycle-sanitized-validation/
            build/ucie-validation/
            build/ucie-mutations/
            build/ucie-sanitized/
